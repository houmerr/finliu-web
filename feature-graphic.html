<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FinLiu - Google Play Feature Graphic Canvas</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #030712;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Tikslūs Google Play Feature Graphic matmenys */
        .feature-graphic {
            width: 1024px;
            height: 500px;
            background-color: #0B0F19;
            background-image: radial-gradient(circle at 85% 50%, rgba(16, 185, 129, 0.15) 0%, transparent 65%);
            border: 1px solid #374151; /* Riba, kad matytųsi kur fotografuoti */
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 120px; /* Saugumo zonos paddingas nuo kraštų */
        }

        .content-left {
            z-index: 2;
            max-width: 500px;
        }

        .brand-name {
            font-size: 4.8rem;
            font-weight: 800;
            color: #F9FAFB;
            letter-spacing: -0.05em;
            margin-bottom: 8px;
            line-height: 1;
        }

        .brand-name span {
            color: #10B981;
        }

        .tagline {
            font-size: 1.6rem;
            color: #9CA3AF;
            font-weight: 500;
            line-height: 1.3;
        }

        .logo-right {
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-right img {
            width: 240px;
            height: 240px;
            object-fit: contain;
            filter: drop-shadow(0 0 35px rgba(16, 185, 129, 0.25));
        }

        /* Fono dekoracija elegancijai */
        .ambient-glow {
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.06) 0%, transparent 70%);
            top: -80px;
            left: -80px;
            z-index: 1;
        }
    </style>
</head>
<body>

    <div class="feature-graphic">
        <div class="ambient-glow"></div>
        
        <div class="content-left">
            <div class="brand-name">Fin<span>Liu</span></div>
            <div class="tagline">Solid Financial Intelligence.<br>Simplified.</div>
        </div>
        
        <div class="logo-right">
            <!-- Nuoroda į tavo pateiktą failą -->
            <img src="finlion_v2.png" alt="FinLiu Lion Logo">
        </div>
    </div>

</body>
</html>
